<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni 视频生成 · AI VIDEO STUDIO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f1a; color: #e0e0e0; min-height: 100vh;
            padding: 24px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .nav-back {
            display: inline-block; color: #888; text-decoration: none; font-size: .86em;
            margin-bottom: 18px; padding: 6px 14px; border: 1px solid #2a2a5c;
            border-radius: 20px; transition: all .2s;
        }
        .nav-back:hover { border-color: #6c3ce0; color: #a78bfa; }
        .header {
            text-align: center; margin-bottom: 32px;
        }
        .header h1 {
            font-size: 2em; color: #fff; letter-spacing: 2px;
            background: linear-gradient(90deg, #a855f7, #6c3ce0, #3b82f6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: #888; margin-top: 8px; font-size: .86em; }

        .panel {
            background: #16162a; border: 1px solid #2a2a5c; border-radius: 16px;
            padding: 24px; margin-bottom: 24px;
        }
        .panel-title {
            font-size: 1em; font-weight: 600; color: #fff; margin-bottom: 18px;
            display: flex; align-items: center; gap: 8px;
        }
        .panel-title::before {
            content: ""; width: 4px; height: 18px; background: #a855f7;
            border-radius: 2px;
        }

        .form-row { margin-bottom: 16px; }
        .form-row label {
            display: block; font-size: .82em; color: #888; margin-bottom: 6px;
            font-weight: 600;
        }
        .form-row input, .form-row textarea, .form-row select {
            width: 100%; background: #0f0f1a; border: 1px solid #2a2a5c;
            color: #e0e0e0; padding: 10px 14px; border-radius: 8px;
            font-size: .9em; font-family: inherit;
        }
        .form-row textarea { resize: vertical; min-height: 90px; }
        .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
            outline: none; border-color: #a855f7;
        }
        .form-hint { color: #666; font-size: .72em; margin-top: 4px; }

        .mode-tabs {
            display: flex; gap: 8px; margin-bottom: 16px;
            border-bottom: 1px solid #2a2a5c; padding-bottom: 12px;
        }
        .mode-tab {
            flex: 1; padding: 8px 12px; text-align: center; cursor: pointer;
            background: transparent; border: 1px solid #2a2a5c; border-radius: 8px;
            color: #888; font-size: .82em; transition: all .2s;
        }
        .mode-tab.active {
            background: rgba(168,85,247,.15); border-color: #a855f7; color: #c084fc;
        }

        .size-options { display: flex; gap: 10px; }
        .size-options label {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px; border: 1px solid #2a2a5c; border-radius: 6px;
            cursor: pointer; font-size: .82em; color: #888; transition: all .2s;
        }
        .size-options input { width: auto; margin-right: 6px; }
        .size-options input:checked + span { color: #c084fc; }
        .size-options label:has(input:checked) { border-color: #a855f7; background: rgba(168,85,247,.08); }

        .btn-primary {
            background: linear-gradient(90deg, #a855f7, #6c3ce0);
            border: none; color: #fff; padding: 12px 24px; border-radius: 8px;
            font-size: .95em; font-weight: 600; cursor: pointer; transition: all .2s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(168,85,247,.35); }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

        .status-box {
            margin-top: 18px; padding: 14px; border-radius: 8px;
            background: #0f0f1a; border: 1px solid #2a2a5c;
            font-size: .82em; color: #888; min-height: 60px;
        }
        .status-box .status-line { margin-bottom: 4px; }
        .status-box .status-line strong { color: #e0e0e0; }
        .status-PENDING { color: #fbbf24; }
        .status-QUEUED { color: #fbbf24; }
        .status-SUCCESS { color: #34d399; }
        .status-FAILED { color: #f87171; }

        .progress-bar {
            margin-top: 8px; height: 6px; background: #1a1a2e; border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #a855f7, #6c3ce0);
            width: 0%; transition: width .3s;
        }

        .video-result {
            margin-top: 20px;
            display: none;
        }
        .video-result video {
            width: 100%; max-width: 720px; border-radius: 12px;
            border: 1px solid #2a2a5c;
        }

        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item {
            padding: 10px 14px; border: 1px solid #2a2a5c; border-radius: 8px;
            font-size: .82em; cursor: pointer; transition: all .2s;
        }
        .history-item:hover { border-color: #a855f7; }
        .history-item .h-row { display: flex; justify-content: space-between; gap: 12px; }
        .history-item .h-prompt { color: #888; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item .h-status { font-size: .85em; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <a class="nav-back" href="/">← 返回首页</a>

        <div class="header">
            <h1>✨ OMNI VIDEO</h1>
            <p>Google Gemini Omni Flash 1.1 · 10s 720p · 原生音频</p>
        </div>

        <div class="panel">
            <div class="panel-title">提交任务</div>

            <div class="mode-tabs">
                <div class="mode-tab active" data-mode="t2v">文生视频</div>
                <div class="mode-tab" data-mode="i2v">图生视频（参考图）</div>
                <div class="mode-tab" data-mode="video_edit">视频修改</div>
            </div>

            <div class="form-row">
                <label>提示词</label>
                <textarea id="prompt" placeholder="A serene morning in a flower garden with dewdrops on rose petals, slow camera pan, soft golden light, cinematic"></textarea>
            </div>

            <div class="form-row" id="image-urls-row" style="display:none;">
                <label>图片/视频 URL（每行一个）</label>
                <textarea id="image_urls" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg" rows="3"></textarea>
                <div class="form-hint">图生视频最多 7 张参考图；视频修改传 1 个视频 URL</div>
            </div>

            <div class="form-row">
                <label>画面尺寸</label>
                <div class="size-options">
                    <label><input type="radio" name="size" value="1280x720" checked><span>1280x720 横屏</span></label>
                    <label><input type="radio" name="size" value="720x1280"><span>720x1280 竖屏</span></label>
                </div>
            </div>

            <button class="btn-primary" id="submit-btn" onclick="submitTask()">提交任务</button>

            <div class="status-box" id="status-box">
                <div class="status-line">状态：<span id="status-text">待提交</span></div>
                <div class="status-line">进度：<span id="stage-text">-</span></div>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            </div>

            <div class="video-result" id="video-result">
                <video controls></video>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">历史任务</div>
            <div class="history-list" id="history-list">
                <div style="color:#666; font-size:.82em;">暂无</div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = "t2v";
        let pollTimer = null;
        let currentTaskId = null;

        // 模式切换
        document.querySelectorAll(".mode-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".mode-tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                currentMode = tab.dataset.mode;
                document.getElementById("image-urls-row").style.display =
                    (currentMode === "t2v") ? "none" : "block";
            });
        });

        async function submitTask() {
            const prompt = document.getElementById("prompt").value.trim();
            if (!prompt) { alert("请输入提示词"); return; }
            const size = document.querySelector('input[name="size"]:checked').value;
            const imageUrlsRaw = document.getElementById("image_urls").value.trim();
            let image_urls = null;
            if (currentMode !== "t2v") {
                image_urls = imageUrlsRaw.split("\n").map(s => s.trim()).filter(s => s);
                if (!image_urls.length) {
                    alert(currentMode === "i2v" ? "请输入至少 1 张图片 URL" : "请输入视频 URL");
                    return;
                }
            }

            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.textContent = "提交中...";

            try {
                const r = await fetch("/api/omni/generate", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ prompt, mode: currentMode, size, image_urls }),
                });
                const d = await r.json();
                if (!d.success) {
                    alert("提交失败：" + (d.detail || JSON.stringify(d)));
                    btn.disabled = false;
                    btn.textContent = "提交任务";
                    return;
                }
                currentTaskId = d.task_id;
                btn.textContent = "生成中...";
                startPolling();
                loadHistory();
            } catch (e) {
                alert("网络错误：" + e);
                btn.disabled = false;
                btn.textContent = "提交任务";
            }
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(pollStatus, 5000);
            pollStatus();
        }

        async function pollStatus() {
            if (!currentTaskId) return;
            try {
                const r = await fetch(`/api/omni/status/${currentTaskId}`);
                const d = await r.json();
                if (!d.success) return;
                const statusText = document.getElementById("status-text");
                const stageText = document.getElementById("stage-text");
                const fill = document.getElementById("progress-fill");
                statusText.textContent = d.status;
                statusText.className = "status-" + d.status;
                stageText.textContent = d.stage || "-";
                fill.style.width = (d.progress || 0) + "%";

                if (d.status === "SUCCESS") {
                    clearInterval(pollTimer); pollTimer = null;
                    const btn = document.getElementById("submit-btn");
                    btn.disabled = false;
                    btn.textContent = "提交任务";
                    if (d.video_url) {
                        const vr = document.getElementById("video-result");
                        vr.style.display = "block";
                        vr.querySelector("video").src = d.video_url;
                    }
                    loadHistory();
                } else if (d.status === "FAILED") {
                    clearInterval(pollTimer); pollTimer = null;
                    const btn = document.getElementById("submit-btn");
                    btn.disabled = false;
                    btn.textContent = "提交任务";
                    stageText.textContent = (d.stage || "失败") + " | " + (d.error || "");
                    loadHistory();
                }
            } catch (e) { console.error(e); }
        }

        async function loadHistory() {
            try {
                const r = await fetch("/api/omni/history");
                const d = await r.json();
                if (!d.success || !d.tasks.length) return;
                const list = document.getElementById("history-list");
                list.innerHTML = d.tasks.map(t => {
                    const statusCls = "status-" + t.status;
                    return `<div class="history-item" onclick="loadTask('${t.task_id}')">
                        <div class="h-row">
                            <span class="h-prompt">${escapeHtml(t.prompt || "")}</span>
                            <span class="h-status ${statusCls}">${t.status}</span>
                        </div>
                        <div class="h-row" style="margin-top:4px;">
                            <span style="color:#666; font-size:.85em;">${t.stage || "-"}</span>
                            <span style="color:#666; font-size:.85em;">${new Date((t.created_at||0)*1000).toLocaleString()}</span>
                        </div>
                    </div>`;
                }).join("");
            } catch (e) { console.error(e); }
        }

        async function loadTask(tid) {
            currentTaskId = tid;
            document.getElementById("submit-btn").disabled = true;
            document.getElementById("submit-btn").textContent = "查看中...";
            startPolling();
        }

        function escapeHtml(s) {
            return (s || "").replace(/[&<>"']/g, m =>
                ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
        }

        loadHistory();
    </script>
</body>
</html>
