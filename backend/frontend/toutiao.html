<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日头条二创</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .topbar { background: linear-gradient(90deg, #ef4444 0%, #f59e0b 100%); padding: 18px 32px; display: flex; align-items: center; gap: 14px; }
        .topbar h1 { font-size: 1.5em; color: #fff; letter-spacing: 2px; }
        .topbar .tag { background: rgba(255,255,255,.2); color: #fff; padding: 4px 14px; border-radius: 20px; font-size: .8em; }
        .back-btn { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.3); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: .9em; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .back-btn:hover { background: rgba(255,255,255,.28); }
        .main { display: flex; min-height: calc(100vh - 60px); }
        .input-panel { width: 480px; min-width: 400px; background: #16162a; border-right: 1px solid #2a2a44; padding: 24px; overflow-y: auto; }
        .section-title { font-size: 1.05em; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .section-title .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-required { background: #ef4444; }
        .dot-optional { background: #fbbf24; }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: .85em; color: #a5a5c8; margin-bottom: 8px; }
        .input-group input[type="text"], .input-group textarea, .input-group select {
            width: 100%; padding: 12px 14px; background: #1e1e36; border: 1px solid #3a3a5c; border-radius: 10px; color: #e0e0e0; font-size: .95em; outline: none; transition: all .2s; font-family: inherit;
        }
        .input-group input[type="text"]:focus, .input-group textarea:focus, .input-group select:focus { border-color: #ef4444; background: #22223e; }
        .input-group textarea { min-height: 80px; resize: vertical; }
        .input-group .hint { font-size: .75em; color: #666; margin-top: 6px; }

        .checkbox-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; background: #1e1e36; padding: 10px 16px; border-radius: 10px; cursor: pointer; border: 1px solid #3a3a5c; transition: all .2s; }
        .checkbox-item:hover { border-color: #ef4444; }
        .checkbox-item.active { border-color: #ef4444; background: #2a1a1a; }
        .checkbox-item input { accent-color: #ef4444; }
        .checkbox-item span { font-size: .9em; }

        .login-status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #1e1e36; border-radius: 10px; margin-bottom: 16px; font-size: .9em; }
        .login-status .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .login-status.ok .dot { background: #22c55e; }
        .login-status.no .dot { background: #ef4444; }
        .login-btn { background: #2a2a44; color: #e0e0e0; border: 1px solid #3a3a5c; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: .85em; margin-left: auto; transition: all .2s; }
        .login-btn:hover { border-color: #ef4444; background: #2a1a1a; }
        .login-btn:disabled { opacity: .5; cursor: not-allowed; }

        .run-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1.1em; font-weight: 600; cursor: pointer; background: linear-gradient(90deg, #ef4444, #f59e0b); color: #fff; transition: all .2s; letter-spacing: 1px; margin-top: 8px; }
        .run-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239,68,68,.4); }
        .run-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
        .run-btn.running { background: linear-gradient(90deg, #f59e0b, #ef4444); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .7; } }

        .output-panel { flex: 1; padding: 24px; overflow-y: auto; background: #0f0f1a; }
        .status-panel { background: #16162a; border-radius: 14px; padding: 24px; margin-bottom: 20px; }
        .status-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .status-badge { padding: 4px 16px; border-radius: 20px; font-size: .85em; font-weight: 600; }
        .badge-idle { background: #2a2a44; color: #888; }
        .badge-running { background: #1e3a5f; color: #60a5fa; animation: pulse 1.5s infinite; }
        .badge-completed { background: #14532d; color: #4ade80; }
        .badge-failed { background: #451a1a; color: #f87171; }
        .steps-bar { display: flex; gap: 4px; margin-bottom: 12px; }
        .step-item { flex: 1; height: 6px; border-radius: 3px; background: #2a2a44; transition: background .3s; }
        .step-item.active { background: #f59e0b; }
        .step-item.done { background: #22c55e; }
        .step-labels { display: flex; gap: 4px; margin-bottom: 16px; font-size: .7em; color: #666; }
        .step-labels span { flex: 1; text-align: center; }
        .log-box { background: #0d0d1a; border-radius: 10px; padding: 14px; font-family: "Cascadia Code", "Fira Code", monospace; font-size: .78em; color: #8b8bab; max-height: 280px; overflow-y: auto; line-height: 1.7; }
        .log-line.running { color: #60a5fa; }
        .log-line.success { color: #4ade80; }
        .log-line.error { color: #f87171; }

        .preview-panel { background: #16162a; border-radius: 14px; padding: 24px; }
        .preview-panel h3 { font-size: 1em; margin-bottom: 16px; color: #e0e0e0; }
        .story-preview { background: #1e1e36; border-radius: 10px; padding: 18px; min-height: 200px; }
        .story-preview h4 { font-size: 1.15em; color: #fff; margin-bottom: 12px; }
        .story-preview .meta { font-size: .8em; color: #888; margin-bottom: 12px; }
        .story-preview .body { font-size: .92em; line-height: 1.8; color: #d0d0e0; }
        .story-preview .body p { margin-bottom: 10px; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
        .image-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid #3a3a5c; }
        .publish-result { margin-top: 14px; padding: 12px; background: #1e1e36; border-radius: 10px; font-size: .9em; }
        .publish-result a { color: #60a5fa; text-decoration: none; }
        .publish-result a:hover { text-decoration: underline; }
        .empty-state { text-align: center; color: #555; padding: 60px 20px; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/" class="back-btn">← 返回</a>
        <h1>今日头条二创</h1>
        <span class="tag">抖音 → 头条自动发布</span>
    </div>

    <div class="main">
        <!-- 输入面板 -->
        <div class="input-panel">
            <div class="section-title">
                <span class="dot dot-required"></span>
                抖音视频链接
            </div>
            <div class="input-group">
                <textarea id="shareUrl" placeholder="粘贴抖音分享链接或分享文案（含链接）&#10;例如：https://v.douyin.com/xxxxxx/"></textarea>
                <div class="hint">支持短链 / 完整URL / 含描述的分享文案</div>
            </div>

            <div class="section-title">
                <span class="dot dot-optional"></span>
                发布类型
            </div>
            <div class="checkbox-row" id="publishTypes">
                <label class="checkbox-item active">
                    <input type="checkbox" value="article" checked>
                    <span>图文文章</span>
                </label>
                <label class="checkbox-item active">
                    <input type="checkbox" value="micro" checked>
                    <span>微头条</span>
                </label>
            </div>

            <div class="section-title" style="margin-top: 20px;">
                <span class="dot dot-optional"></span>
                发布参数
            </div>
            <div class="input-group">
                <label>配图数量</label>
                <select id="imageCount">
                    <option value="3">3 张</option>
                    <option value="5" selected>5 张</option>
                    <option value="6">6 张</option>
                    <option value="9">9 张</option>
                </select>
                <div class="hint">混合方案：原视频抽帧 + AI生图</div>
            </div>

            <div class="section-title" style="margin-top: 20px;">
                <span class="dot dot-required"></span>
                抖音账号登录
            </div>
            <div class="login-status no" id="douyinLoginStatus">
                <span class="dot"></span>
                <span id="douyinLoginText">未登录</span>
                <button class="login-btn" id="douyinLoginBtn">扫码登录抖音</button>
            </div>

            <div class="section-title" style="margin-top: 20px;">
                <span class="dot dot-required"></span>
                头条账号登录
            </div>
            <div class="login-status no" id="loginStatus">
                <span class="dot"></span>
                <span id="loginText">未登录</span>
                <button class="login-btn" id="loginBtn">扫码登录头条</button>
            </div>

            <button class="run-btn" id="runBtn">开始二创并发布</button>
        </div>

        <!-- 输出面板 -->
        <div class="output-panel">
            <div class="status-panel">
                <div class="status-header">
                    <span class="status-badge badge-idle" id="statusBadge">待命</span>
                    <span id="statusText" style="color: #888; font-size: .9em;">等待开始</span>
                </div>
                <div class="steps-bar" id="stepsBar">
                    <div class="step-item"></div>
                    <div class="step-item"></div>
                    <div class="step-item"></div>
                    <div class="step-item"></div>
                    <div class="step-item"></div>
                </div>
                <div class="step-labels">
                    <span>下载视频</span>
                    <span>ASR文案</span>
                    <span>LLM改写</span>
                    <span>准备配图</span>
                    <span>自动发布</span>
                </div>
                <div class="log-box" id="logBox">
                    <div class="log-line">[等待] 点击"开始二创并发布"启动流程</div>
                </div>
            </div>

            <div class="preview-panel">
                <h3>生成内容预览</h3>
                <div class="story-preview" id="storyPreview">
                    <div class="empty-state">尚未生成内容</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 复选框样式同步
        document.querySelectorAll('#publishTypes .checkbox-item').forEach(item => {
            const cb = item.querySelector('input');
            const sync = () => item.classList.toggle('active', cb.checked);
            cb.addEventListener('change', sync);
            sync();
        });

        const $ = id => document.getElementById(id);
        const logBox = $('logBox');
        const statusBadge = $('statusBadge');
        const statusText = $('statusText');
        const stepsBar = $('stepsBar');
        const storyPreview = $('storyPreview');
        const runBtn = $('runBtn');

        function addLog(msg, type = 'info') {
            const now = new Date();
            const ts = now.toTimeString().slice(0, 8);
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = `[${ts}] ${msg}`;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setStatus(state, text) {
            const map = {
                idle: ['badge-idle', '待命'],
                running: ['badge-running', '运行中'],
                completed: ['badge-completed', '完成'],
                failed: ['badge-failed', '失败']
            };
            const [cls, label] = map[state] || map.idle;
            statusBadge.className = `status-badge ${cls}`;
            statusText.textContent = text || label;
        }

        function setStep(index, state) {
            // index 0..4, state: 'active' | 'done'
            const items = stepsBar.querySelectorAll('.step-item');
            items.forEach((item, i) => {
                if (i < index) {
                    item.className = 'step-item done';
                } else if (i === index) {
                    item.className = `step-item ${state}`;
                } else {
                    item.className = 'step-item';
                }
            });
        }

        function renderStory(story, imagePaths, publishResult) {
            const title = story.title || '未命名';
            const micro = story.micro_content || '';
            const keywords = (story.image_keywords || []).join('、');
            const html = story.content_html || '<p>（无正文）</p>';
            const imagesHtml = (imagePaths || []).map(p => `<img src="${p}" />`).join('');
            const articleLink = publishResult?.article_url
                ? `<div>文章：<a href="${publishResult.article_url}" target="_blank">${publishResult.article_url}</a></div>` : '';
            const microLink = publishResult?.micro_url
                ? `<div>微头条：<a href="${publishResult.micro_url}" target="_blank">${publishResult.micro_url}</a></div>` : '';

            storyPreview.innerHTML = `
                <h4>${title}</h4>
                <div class="meta">配图关键词：${keywords}</div>
                <div class="body">${html}</div>
                <div style="margin-top: 16px; font-size: .85em; color: #888;">微头条：</div>
                <div class="body" style="margin-top: 6px; padding: 10px; background: #0d0d1a; border-radius: 8px;">${micro}</div>
                ${imagesHtml ? `<div class="image-grid">${imagesHtml}</div>` : ''}
                ${(articleLink || microLink) ? `<div class="publish-result">${articleLink}${microLink}</div>` : ''}
            `;
        }

        // 检查登录状态
        async function checkLogin() {
            try {
                // 头条登录状态
                const resp = await fetch('/api/toutiao/login/status');
                const data = await resp.json();
                const status = $('loginStatus');
                const text = $('loginText');
                if (data.logged_in) {
                    status.className = 'login-status ok';
                    text.textContent = '已登录';
                } else {
                    status.className = 'login-status no';
                    text.textContent = '未登录';
                }
                // 抖音登录状态
                const dyResp = await fetch('/api/toutiao/douyin/login/status');
                const dyData = await dyResp.json();
                const dyStatus = $('douyinLoginStatus');
                const dyText = $('douyinLoginText');
                if (dyData.logged_in) {
                    dyStatus.className = 'login-status ok';
                    dyText.textContent = '已登录';
                } else {
                    dyStatus.className = 'login-status no';
                    dyText.textContent = '未登录';
                }
            } catch (e) {
                console.error(e);
            }
        }

        // 扫码登录头条
        $('loginBtn').addEventListener('click', async () => {
            const btn = $('loginBtn');
            btn.disabled = true;
            btn.textContent = '等待扫码...';
            addLog('启动浏览器，等待扫码登录头条...');
            try {
                const resp = await fetch('/api/toutiao/login', { method: 'POST' });
                const data = await resp.json();
                if (data.success) {
                    addLog('头条登录成功', 'success');
                    checkLogin();
                } else {
                    addLog(`头条登录失败: ${data.detail || '未知错误'}`, 'error');
                }
            } catch (e) {
                addLog(`登录请求失败: ${e.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '扫码登录头条';
            }
        });

        // 扫码登录抖音
        $('douyinLoginBtn').addEventListener('click', async () => {
            const btn = $('douyinLoginBtn');
            btn.disabled = true;
            btn.textContent = '等待扫码...';
            addLog('启动浏览器，等待扫码登录抖音...');
            try {
                const resp = await fetch('/api/toutiao/douyin/login', { method: 'POST' });
                const data = await resp.json();
                if (data.success) {
                    addLog('抖音登录成功', 'success');
                    checkLogin();
                } else {
                    addLog(`抖音登录失败: ${data.detail || '未知错误'}`, 'error');
                }
            } catch (e) {
                addLog(`登录请求失败: ${e.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '扫码登录抖音';
            }
        });

        // 开始二创
        runBtn.addEventListener('click', async () => {
            const shareUrl = $('shareUrl').value.trim();
            if (!shareUrl) {
                addLog('请填写抖音链接', 'error');
                return;
            }
            const publishTypes = Array.from(document.querySelectorAll('#publishTypes input:checked')).map(c => c.value);
            const imageCount = parseInt($('imageCount').value);

            runBtn.disabled = true;
            runBtn.classList.add('running');
            runBtn.textContent = '二创进行中...';
            logBox.innerHTML = '';
            setStatus('running', '运行中');
            setStep(0, 'active');

            try {
                const resp = await fetch('/api/toutiao/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        share_url: shareUrl,
                        publish_types: publishTypes,
                        target_image_count: imageCount,
                    })
                });
                const data = await resp.json();
                if (!data.success) {
                    throw new Error(data.detail || '启动失败');
                }
                const taskId = data.task_id;
                addLog(`任务已启动: ${taskId}`);

                // 轮询状态
                const poll = async () => {
                    try {
                        const s = await (await fetch(`/api/toutiao/status/${taskId}`)).json();
                        if (s.log) {
                            s.log.split('\n').filter(Boolean).forEach(line => {
                                const m = line.match(/^\[(\d{2}:\d{2}:\d{2})\]\s+(.+)$/);
                                if (m && !logBox.innerHTML.includes(m[1])) {
                                    addLog(m[2]);
                                }
                            });
                        }
                        if (s.step !== undefined) setStep(s.step, s.state || 'active');
                        if (s.status === 'running') {
                            setTimeout(poll, 1000);
                        } else if (s.status === 'completed') {
                            setStatus('completed', '完成');
                            setStep(5, 'done');
                            addLog('二创并发布完成！', 'success');
                            renderStory(s.result.story, s.result.image_paths, s.result.publish_result);
                            runBtn.disabled = false;
                            runBtn.classList.remove('running');
                            runBtn.textContent = '开始二创并发布';
                        } else if (s.status === 'failed') {
                            setStatus('failed', '失败');
                            addLog(`失败: ${s.error || '未知错误'}`, 'error');
                            runBtn.disabled = false;
                            runBtn.classList.remove('running');
                            runBtn.textContent = '开始二创并发布';
                        }
                    } catch (e) {
                        addLog(`状态查询失败: ${e.message}`, 'error');
                        setTimeout(poll, 2000);
                    }
                };
                poll();
            } catch (e) {
                addLog(`启动失败: ${e.message}`, 'error');
                setStatus('failed', '失败');
                runBtn.disabled = false;
                runBtn.classList.remove('running');
                runBtn.textContent = '开始二创并发布';
            }
        });

        // 初始化
        checkLogin();
    </script>
</body>
</html>
