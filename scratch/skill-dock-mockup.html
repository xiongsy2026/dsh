<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能 dock · Tab 版 · Weeksir 橙</title>
<style>
  :root{
    --bg:#121212; --layer1:#171717; --layer2:#151515;
    --l1:#f5f5f5; --l2:#d9d9d9; --l3:#969696;
    --border:#ffffff14;
    --accent:#fa6f08; --accent-2:#b118d6;
    --font:"Inter","Noto Sans SC",-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--l1);font-family:var(--font);
       display:flex;justify-content:center;padding:40px 24px 80px}
  .wrap{width:100%;max-width:860px}
  .composer{background:var(--layer1);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
  .composer .ph{color:var(--l3);font-size:14px}
  .crow{display:flex;gap:8px;align-items:center;margin-top:14px}
  .mini{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;
        background:var(--layer2);border:1px solid var(--border);color:var(--l2);font-size:12.5px}
  .mini .d{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .send{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px}

  /* Tab 栏（单选切换） */
  .tabs{display:flex;align-items:center;gap:6px;margin:16px 2px 12px}
  .tab{height:30px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid transparent;
       color:var(--l3);font-size:13px;cursor:pointer;font-weight:600;transition:.15s}
  .tab:hover{color:var(--l2)}
  .tab.on{color:var(--l1);background:var(--layer1);border-color:var(--border)}
  .tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
  .sep{width:1px;height:16px;background:var(--border);margin:0 4px}

  .dock{margin:0 2px}
  .dock-head{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
  .nav{margin-left:auto;display:flex;gap:6px}
  .nav button{width:28px;height:28px;border-radius:50%;background:var(--layer2);border:1px solid var(--border);
              color:var(--l2);cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}
  .nav button:hover{border-color:var(--accent);color:var(--l1)}
  .row{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:2px 2px 8px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .card{flex:0 0 auto;width:236px;border-radius:12px;overflow:hidden;cursor:pointer;
        background:var(--layer1);border:1px solid var(--border);transition:transform .16s cubic-bezier(.2,.7,.3,1),border-color .16s,box-shadow .16s}
  .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(0,0,0,.7)}
  .cv{height:132px;display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;
      background:linear-gradient(135deg,#3a2a1a,#1a1420),radial-gradient(120% 120% at 30% 20%,rgba(250,111,8,.5),transparent 60%);
      background-blend-mode:screen}
  .bd{padding:10px 12px 12px}
  .nm{font-size:14px;font-weight:600;color:var(--l1);line-height:20px}
  .ds{font-size:12px;color:var(--l3);line-height:17px;margin-top:3px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{color:var(--l3);font-size:13px;padding:18px 2px}
  .hint{font-size:12px;color:var(--l3);margin:14px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="composer">
    <div class="ph">发消息或创建任务，/ 调用指令，@ 文件或对话</div>
    <div class="crow">
      <span class="mini"><span class="d"></span>技能</span>
      <span class="mini"><span class="d"></span>智能匹配模型</span>
      <span class="mini">创作偏好</span>
      <span class="send">↑</span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-tab="recent">最近使用</button>
    <span class="sep"></span>
    <button class="tab on" data-tab="reco">推荐技能</button>
  </div>

  <div class="dock">
    <div class="dock-head"><span class="nav"><button id="prev">‹</button><button id="next">›</button></span></div>
    <div class="row" id="row"></div>
    <p class="hint">点卡片 → 把 <code>/技能名 </code> 填进输入框（不自动发）。<b>推荐技能</b>=运营策展有序清单；<b>最近使用</b>=你点过的（空则不显示该 tab）。</p>
  </div>
</div>

<script>
  const RECO = [
    {n:"Omni 出片", d:"产品图 → 竖屏带货广告，含剧本/关键帧/口播"},
    {n:"爆款复刻", d:"换产品 / 换脸，对齐原声时间轴复刻"},
    {n:"超级复刻", d:"换产品 / 换脸 / 高保真对齐"},
    {n:"抽帧时间轴", d:"原片抽帧 + 原声贴回，出 BRIEF/TIMELINE"},
    {n:"图片生成", d:"主图 / 细节图 / 角色定妆图"},
    {n:"音频生成", d:"口播配音 / 背景音乐"},
  ];
  // 模拟"最近使用"（真实来自 localStorage）
  let RECENT = ["Omni 出片","抽帧时间轴"];
  const byName = {}; RECO.forEach(s=>byName[s.n]=s);

  const row=document.getElementById('row');
  function render(tab){
    row.innerHTML='';
    let list = tab==='recent' ? RECENT.map(n=>byName[n]).filter(Boolean) : RECO;
    if(tab==='recent' && !list.length){ row.innerHTML='<div class="empty">最近还没用过技能，去「推荐技能」挑一个。</div>'; return; }
    list.forEach(s=>{
      const c=document.createElement('div'); c.className='card';
      c.innerHTML='<div class="cv">'+s.n.slice(0,1).toUpperCase()+'</div><div class="bd"><div class="nm">'+s.n+'</div><div class="ds">'+s.d+'</div></div>';
      c.onclick=()=>{ RECENT=[s.n].concat(RECENT.filter(x=>x!==s.n)).slice(0,8); };
      row.appendChild(c);
    });
  }
  document.getElementById('tabs').addEventListener('click',e=>{
    const t=e.target.closest('.tab'); if(!t) return;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    render(t.dataset.tab);
  });
  document.getElementById('next').onclick=()=>row.scrollBy({left:250,behavior:'smooth'});
  document.getElementById('prev').onclick=()=>row.scrollBy({left:-250,behavior:'smooth'});
  render('reco');
</script>
</body>
</html>
