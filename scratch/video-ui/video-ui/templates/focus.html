<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omni 出片 · 流水线</title>
<style>
  :root { --bg:#0f1115; --fg:#e7e9ee; --mut:#8a90a0; --line:#23262e; --ok:#3fb96b; --warn:#d9a441; --bad:#e0574f; --run:#4b6ef5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  .logo { width:22px;height:22px;border-radius:6px;background:var(--run);display:grid;place-items:center;font-size:12px; }
  .bname { font-weight:700; }
  .hist-btn { margin-left:auto; font-size:12px; color:var(--mut); background:none; border:1px solid var(--line); border-radius:14px; padding:3px 10px; cursor:pointer; }
  .hist-btn:hover { color:var(--fg); border-color:var(--run); }
  .runmeta { font-size:12px; color:var(--mut); }
  main { padding:14px; max-width:820px; margin:0 auto; }
  .stage { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .step { font-size:12px; color:var(--mut); border:1px solid var(--line); border-radius:14px; padding:3px 10px; }
  .step.on { color:#fff; border-color:var(--run); background:rgba(75,110,245,.18); }
  .step.done { color:var(--ok); border-color:var(--ok); }
  h3 { font-size:13px; color:var(--mut); font-weight:600; margin:18px 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .cell { position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden; aspect-ratio:9/16; background:#161821; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .cell .st { position:absolute; left:0; right:0; bottom:0; font-size:10px; padding:1px 4px; background:rgba(0,0,0,.6); color:#fff; display:flex; justify-content:space-between; }
  .cell.running { opacity:.6; } .cell.failed { border-color:var(--bad); } .cell.done { border-color:var(--ok); }
  .spin { position:absolute; inset:0; display:grid; place-items:center; color:var(--mut); }
  video { width:100%; border-radius:8px; border:1px solid var(--line); background:#000; }
  .empty { color:var(--mut); padding:40px; text-align:center; }
  .cur { color:var(--run); }
  /* 历史记录抽屉 */
  #hist { position:fixed; top:0; right:0; height:100%; width:300px; max-width:85vw; background:#14161d; border-left:1px solid var(--line); transform:translateX(100%); transition:transform .18s; z-index:20; display:flex; flex-direction:column; }
  #hist.open { transform:none; }
  #hist .hh { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  #hist .hh b { font-size:13px; } #hist .x { margin-left:auto; cursor:pointer; color:var(--mut); border:none; background:none; font-size:18px; }
  #hist .list { overflow:auto; padding:6px; }
  .ritem { padding:9px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .ritem:hover { background:#1b1e27; } .ritem.sel { border-color:var(--run); background:rgba(75,110,245,.12); }
  .ritem .t { font-size:13px; } .ritem .m { font-size:11px; color:var(--mut); margin-top:2px; }
</style>
</head>
<body>
<header>
  <span class="logo">▶</span><span class="bname">omni 出片</span>
  <span class="runmeta" id="runmeta">加载中…</span>
  <button class="hist-btn" id="histBtn">历史记录</button>
</header>
<main id="main"><div class="empty">加载中…</div></main>

<div id="hist">
  <div class="hh"><b>历史记录</b><button class="x" id="histClose">×</button></div>
  <div class="list" id="histList"></div>
</div>

<script>
const API = "";                       // 同源
const STEPS = [["intake","建档"],["script","剧本"],["frames","关键帧"],["camera","运镜"],["video","出片"],["done","成片"]];
let runs = [], focus = null, timer = null;

async function j(u){ const r = await fetch(API+u); if(!r.ok) throw new Error(r.status); return r.json(); }

function pickDefault(){
  const q = new URLSearchParams(location.search).get("run");
  if(q && runs.some(r=>r.name===q)) return q;
  return runs.length ? runs[0].name : null;   // list_runs 已按 mtime 倒序 → 最新
}

function stageIdx(s){ const order=["intake","script_review","frames","frames_review","camera","video","done"]; let i=order.indexOf(s); return i<0?0:i; }

function renderRun(st, beats){
  const m = document.getElementById("main");
  if(!st){ m.innerHTML = '<div class="empty">还没有 run。agent 建一条后这里会自动出现。</div>'; return; }
  const si = stageIdx(st.stage);
  let html = '<div class="stage">';
  STEPS.forEach((s,i)=>{
    const cls = i<si?"done":(i===si?"on":"");
    html += `<span class="step ${cls}">${s[1]}</span>`;
  });
  html += '</div>';
  const job = st.job||{};
  if(job.active) html += `<div class="runmeta" style="margin-bottom:8px">⏳ ${esc(job.current||"处理中…")}</div>`;

  // 关键帧网格
  const frames = st.frames||{};
  if(Object.keys(frames).length){
    html += '<h3>关键帧</h3><div class="grid">';
    for(const [k,f] of Object.entries(frames)){
      const src = f.thumb ? `${API}/files/${encodeURIComponent(st.name)}/${f.thumb}` : "";
      const cls = f.status||"";
      const inner = src && cls!=="running" ? `<img loading="lazy" src="${src}">` : (cls==="running"?'<div class="spin">…</div>':'<div class="spin">—</div>');
      html += `<div class="cell ${cls}">${inner}<span class="st"><b>${k}</b><span>${f.backend||''}</span></span></div>`;
    }
    html += '</div>';
  }
  // 分段
  const seg = st.segment_status||{};
  if(Object.keys(seg).length){
    html += '<h3>分段</h3><div class="grid" style="grid-template-columns:repeat(3,1fr)">';
    for(const [k,v] of Object.entries(seg)){
      const src = v.file ? `${API}/files/${encodeURIComponent(st.name)}/${v.file}` : "";
      html += `<div class="cell ${v.status||''}" style="aspect-ratio:9/16">${src?`<video src="${src}" controls preload="metadata"></video>`:'<div class="spin">'+(v.status||'')+'</div>'}</div>`;
    }
    html += '</div>';
  }
  // 成片
  const fin = st.final||{};
  const fsrc = fin.clean||fin.concat;
  if(fsrc){
    html += '<h3>成片</h3><video src="'+API+'/files/'+encodeURIComponent(st.name)+'/'+fsrc+'" controls preload="metadata"></video>';
  }
  m.innerHTML = html;
}

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function loadFocus(){
  if(!focus){ document.getElementById("main").innerHTML='<div class="empty">还没有 run。</div>'; document.getElementById("runmeta").textContent=""; return; }
  try{
    const d = await j("/api/run/"+encodeURIComponent(focus));
    const st = d.state||d;
    const r = runs.find(x=>x.name===focus)||{};
    document.getElementById("runmeta").innerHTML = `<span class="cur">${esc(r.title||st.title||focus)}</span> · ${st.mode||''} ${st.duration||''}s · ${st.segments||''}段`;
    renderRun(st, d.beats);
  }catch(e){ document.getElementById("main").innerHTML='<div class="empty">读取失败：'+esc(String(e))+'</div>'; }
}

async function refresh(){
  try{
    const b = await j("/api/bootstrap");
    runs = b.runs||[];
    if(!focus || !runs.some(r=>r.name===focus)) focus = pickDefault();
    renderHist();
    await loadFocus();
  }catch(e){ /* 服务没起，下次再试 */ }
}

function renderHist(){
  const el = document.getElementById("histList");
  el.innerHTML = runs.map(r=>`<div class="ritem ${r.name===focus?'sel':''}" data-n="${esc(r.name)}">
    <div class="t">${esc(r.title||r.name)}</div>
    <div class="m">${r.mode||''} · ${r.duration||''}s · ${r.segments||''}段 · ${esc(r.stage||'')} · ${r.size_mb||0}MB</div></div>`).join('') || '<div class="empty">无</div>';
  el.querySelectorAll(".ritem").forEach(it=>it.onclick=()=>{ focus=it.getAttribute("data-n"); renderHist(); loadFocus(); closeHist(); });
}

function openHist(){ document.getElementById("hist").classList.add("open"); }
function closeHist(){ document.getElementById("hist").classList.remove("open"); }
document.getElementById("histBtn").onclick=openHist;
document.getElementById("histClose").onclick=closeHist;

refresh();
timer = setInterval(refresh, 4000);   // 轮询：agent 建新 run / 产物刷新会自动跟上
</script>
</body>
</html>
